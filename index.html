<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>saflow — настольный справочник</title>
  <style>
    :root {
      --bg: #f3efe6;
      --paper: #fffdf8;
      --ink: #1d1914;
      --muted: #5f574d;
      --line: #e3d9cb;
      --accent: #1e4636;
      --accent-soft: #e5efe9;
      --danger: #6e2e24;
      --shadow: none;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.5 "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    }
    button, input { font: inherit; }
    .app {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 100vh;
    }
    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 28px 18px 32px;
      border-right: 1px solid var(--line);
      background: #efeae0;
    }
    .mark {
      margin: 0 8px 4px;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }
    aside h1 {
      margin: 0 8px 16px;
      font-size: 28px;
      line-height: 1.15;
      font-weight: 600;
    }
    .find {
      width: calc(100% - 16px);
      margin: 0 8px 14px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
      color: var(--ink);
    }
    nav { display: flex; flex-direction: column; gap: 4px; }
    nav button {
      text-align: left;
      border: 0;
      background: transparent;
      color: var(--ink);
      border-radius: 8px;
      padding: 8px 10px;
      cursor: pointer;
    }
    nav button small {
      display: block;
      color: var(--muted);
      font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      font-size: 12px;
    }
    nav button[aria-current="true"] {
      background: var(--accent);
      color: #f6f3ec;
    }
    nav button[aria-current="true"] small { color: #d5e4db; }
    nav button.hidden { display: none; }
    main {
      padding: 36px 48px 80px;
      max-width: 920px;
    }
    .situation {
      margin: 0 0 6px;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      font-size: 13px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }
    main h2 {
      margin: 0 0 8px;
      font-size: 34px;
      line-height: 1.15;
      font-weight: 600;
    }
    .lead {
      margin: 0 0 22px;
      color: var(--muted);
    }
    article h1 { font-size: 22px; margin: 28px 0 8px; }
    article h2 { font-size: 22px; margin: 28px 0 8px; }
    article h3 { font-size: 18px; margin: 22px 0 8px; }
    article p { margin: 0 0 12px; }
    article ul, article ol { margin: 0 0 14px; padding-left: 1.2em; }
    article li { margin: 0 0 6px; }
    article code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.88em;
      background: var(--accent-soft);
      padding: 0 4px;
      border-radius: 4px;
    }
    .prompt {
      margin-top: 28px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px 16px 12px;
    }
    .prompt h3 {
      margin: 0 0 8px;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
    .actions button {
      border: 1px solid var(--accent);
      background: var(--accent);
      color: #f6f3ec;
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
    }
    .actions button.secondary {
      background: transparent;
      color: var(--accent);
    }
    pre {
      margin: 0;
      max-height: 360px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.45;
      background: #f7f4ee;
      border-radius: 8px;
      padding: 12px;
    }
    .note {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: var(--ink);
      color: #f6f3ec;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    @media (max-width: 800px) {
      .app { grid-template-columns: 1fr; }
      aside { position: relative; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      main { padding: 24px 18px 64px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <p class="mark">saflow</p>
      <h1>Справочник</h1>
      <input class="find" type="search" placeholder="Найти ситуацию" aria-label="Найти ситуацию">
      <nav id="nav"></nav>
    </aside>
    <main>
      <p class="situation" id="situation"></p>
      <h2 id="title"></h2>
      <p class="lead" id="lead"></p>
      <article id="card"></article>
      <section class="prompt" id="prompt-box">
        <h3>Промпт для нового диалога</h3>
        <div class="actions">
          <button type="button" id="copy-all">Скопировать промпт</button>
          <button type="button" class="secondary" id="copy-system">Скопировать только правила</button>
        </div>
        <pre id="prompt"></pre>
        <p class="note">Вставьте страницу проекта и файлы, которые промпт перечисляет. Прошлый диалог не продолжайте: в длинном чате остаются старые догадки.</p>
      </section>
    </main>
  </div>
  <div class="toast" id="toast">Скопировано</div>
  <script id="data" type="application/json">{"steps": [{"id": "00", "situation": "Не знаю, с какого шага начать", "title": "Стол", "card": "# Стол\n\nТак справочником пользуются в течение задачи. Открыта одна карточка — того шага, на котором вы сейчас. Остальные не читают.\n\n## Что всегда лежит на столе\n\nОдна страница проекта, не папка документации. На ней только то, что уже правда:\n\n- слова этой системы, а не синонимы из головы;\n- кто чем владеет: сервис, модуль, подсистема или пакет;\n- какие сущности и таблицы уже есть;\n- соглашения по типам, ошибкам, деньгам, событиям;\n- ограничения, которые нельзя нарушить.\n\nПока страницы нет, любой шаг будет заново исследовать продукт и додумывать его.\n\n## Ритуал одного шага\n\n1. Собрать факты. Решение этого шага в факты не записывать.\n2. Открыть новый диалог. Вставить страницу проекта, бриф и уже принятый прошлый артефакт.\n3. Прочитать ответ как рецензент. Выписать вопросы людям, у каждого есть адресат.\n4. Не начинать следующий шаг, если открытый вопрос меняет сценарий, состав данных или владельца кода.\n\nОтвет человеку записывается до новой сборки промпта. Иначе следующий шаг закроет дыру сам.\n\n## Четыре вопроса к любому действию системы\n\nИх держат перед глазами на шаге поведения и на ревью:\n\n- внешняя система не ответила или ответила ошибкой;\n- данных пришло меньше, чем шаг ожидал;\n- то же действие пришло второй раз;\n- состояние уже не то, на которое шаг рассчитывал.\n\nЕсли ветка невозможна, это пишут одной строкой, а не пропускают молча.\n\n## Куда идти\n\n- Есть только слова заказчика — карточка 01.\n- История принята, поведение ещё не разобрано — 02.\n- Неясно, новая ли это сущность — 03.\n- Сущности ясны, нужна схема хранения — 04.\n- Неясно, чья это доработка и выкатится ли она одной командой — 05.\n- Надо показать порядок вызовов — 06.\n- Разработчику нужен контракт — 07.\n- Пора заводить задачи — 08.\n\nШаг, которого в системе нет, не имитируют. Его выключают с причиной: нет своей базы, нет HTTP, нет шины. Причина остаётся видна следующим карточкам.\n\nКоманда этой карточки: `python3 saflow.py card 00`", "system": "", "user": "", "files": []}, {"id": "01", "situation": "Заказчик дал несколько предложений", "title": "01. User Story", "card": "# 01. User Story\n\nИстория фиксирует ожидание заказчика и проверяемый результат. Как система это сделает, здесь не решают. Историю пишут вместе с продактом, модель только приводит её в форму и подсказывает края, которые легко пропустить.\n\n## На столе\n\n- Пять предложений заказчика, как их сказали.\n- Факты: цифры, уже принятые границы, что в эту задачу не входит.\n- Страница проекта.\n\n## Спросить\n\n- Кто герой и какую свою работу он перестаёт делать.\n- По какому наблюдаемому результату задачу считают готовой.\n- Какой один граничный случай и какой один отказ обязательны в приёмке.\n- Что похоже на эту задачу, но сюда не входит.\n\n## Модели можно\n\nПеревести слова в «Как роль, я хочу действие, чтобы ценность». Ценность не повторяет действие другими словами. Написать минимум три сценария: основной, граничный, негативный. Значения в них конкретные: номер, сумма, статус, имя магазина.\n\n## Модели нельзя\n\nПредлагать API, таблицы, экраны и «как мы это реализуем». Писать «корректно», «некоторая сумма», «любой статус». Укладывать в одну историю работу нескольких команд на несколько спринтов и не показать разрез.\n\n## Принять\n\n- Есть формула «как / хочу / чтобы».\n- Три сценария Дано / Когда / Тогда с конкретными значениями.\n- Есть блок «Вне области задач».\n- Каждый пробел вынесен в «Открытые вопросы» и подписан, кому его нести.\n\nДальше только после приёмки. Файл `01-user-story.md`. Промпт: `python3 saflow.py prompt \u003cфича> 01`", "system": "Ты — продуктовый аналитик. Твоя задача — превращать сырые требования заказчика в пользовательские истории с проверяемыми критериями приёмки.\n\nПРАВИЛА\n1. Формат истории: «Как \u003cроль>, я хочу \u003cдействие>, чтобы \u003cценность>». В ценности не повторяй действие другими словами.\n2. Критерии приёмки — Given/When/Then (Дано / Когда / Тогда). Минимум три сценария: основной, граничный, негативный.\n3. Все значения в сценариях конкретные. «Некоторая сумма», «любой статус», «корректно» — запрещены.\n4. Если история не помещается в один спринт одной команды — раздели и покажи разделение явно.\n5. Отдельным блоком: «Вне области задач» — что похоже, но в эту историю не входит.\n6. Всё, чего нет во входных данных, не выдумывай: выноси в блок ОТКРЫТЫЕ ВОПРОСЫ с формулировкой, кому этот вопрос адресован.\n7. Не предлагай технических решений.", "user": "\u003cПРОЕКТ>\nВставьте сюда страницу проекта целиком: глоссарий, зоны ответственности, сущности, соглашения, ограничения.\n\n\u003cБРИФ ФИЧИ>\nВставьте слова заказчика и известные факты. Решение этого шага сюда не дописывайте.\n\n\u003cОТВЕТЫ НА ОТКРЫТЫЕ ВОПРОСЫ>\nВставьте ответы людей. Если их ещё нет, напишите: ответов пока нет.\n\nЗАДАЧА\nСоставь пользовательские истории и критерии приёмки. Если результат не помещается в один спринт одной команды — раздели истории явно.\n", "files": ["01-user-story.md"]}, {"id": "02", "situation": "История есть, поведение не разложено", "title": "02. Use Case", "card": "# 02. Use Case\n\nИстория говорит, что обещали. Use case говорит, что система делает по шагам и где сценарий сворачивает. Это декомпозиция поведения, не макет экрана.\n\n## На столе\n\n- Принятая пользовательская история.\n- Ограничения системы: что неизменно, что внешнее, синхронный вызов или нет.\n- Страница проекта.\n\n## Спросить\n\n- Кто действующее лицо.\n- Что остаётся верным при любом исходе. Это минимальные гарантии, их можно проверить.\n- Какие системы для этого сценария внешние.\n- Что считать повтором: тот же ключ, то же событие, второй клик.\n\n## Модели можно\n\nРазложить основной сценарий на шаги. Один шаг — одно действие одного участника, активный залог. На каждый шаг ответить на четыре вопроса сбоя. Расширения нумеровать от шага: 3a, 3b, 5a. Если ветки нет, написать «расширений нет» и одну строку почему.\n\n## Модели нельзя\n\nПисать «система обрабатывает и отправляет» одним шагом. Называть кнопки, поля и экраны. Выдумывать бизнес-правило или ссылаться на документ, которого не было во входе.\n\n## Принять\n\nВ тексте есть область, действующее лицо, предусловия, минимальные гарантии, гарантии успеха, триггер, основной сценарий, расширения и открытые вопросы. У каждого шага либо расширение, либо явный отказ от него.\n\nФайл `02-use-case.md`. Промпт: `python3 saflow.py prompt \u003cфича> 02`", "system": "Ты — системный аналитик. Ты описываешь поведение системы в формате use case.\n\nСТРУКТУРА (все разделы обязательны)\nID и название · область действия · основное действующее лицо · предусловия · минимальные гарантии · гарантии успеха · триггер · основной сценарий · расширения · открытые вопросы.\n\nПРАВИЛА\n1. Шаг — одно действие одного участника. «Система обрабатывает и отправляет» запрещено: это два шага.\n2. Активный залог, явно указано, кто действует.\n3. Никаких элементов интерфейса.\n4. Для КАЖДОГО шага проверь четыре вопроса и заведи расширение, если ответ не «невозможно»:\n   — внешняя система не ответила или ответила ошибкой;\n   — данных пришло меньше, чем ожидалось;\n   — шаг выполняется повторно (дубль запроса или события);\n   — исходное состояние не то, которое предполагал шаг.\n   Если расширения для шага нет — напиши «расширений нет» и обоснуй одной строкой.\n5. Нумерация расширений: 3a, 3b, 5a — по номеру шага.\n6. Минимальные гарантии формулируй как проверяемые утверждения, которые верны при ЛЮБОМ исходе сценария.\n7. Не выдумывай бизнес-правила и не ссылайся на документы, которых нет во входных данных. Недостающее — в ОТКРЫТЫЕ ВОПРОСЫ.", "user": "\u003cПРОЕКТ>\nВставьте сюда страницу проекта целиком: глоссарий, зоны ответственности, сущности, соглашения, ограничения.\n\n\u003cБРИФ ФИЧИ>\nВставьте слова заказчика и известные факты. Решение этого шага сюда не дописывайте.\n\n\u003cОТВЕТЫ НА ОТКРЫТЫЕ ВОПРОСЫ>\nВставьте ответы людей. Если их ещё нет, напишите: ответов пока нет.\n\n\u003cUser Story — результат шага 01>\nВставьте 01-user-story.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\nЗАДАЧА\nСоставь use case по пользовательской истории. Покрой основной сценарий и расширения.\n", "files": ["02-use-case.md"]}, {"id": "03", "situation": "Неясно, новые ли это данные", "title": "03. Модель данных", "card": "# 03. Модель данных\n\nВопрос шага: какие сущности уже есть, каким не хватает атрибута, какие появляются из-за этой фичи. Таблицы и типы здесь рано. Их легко нарисовать и потом защищать.\n\n## На столе\n\n- Принятый use case.\n- Список текущих сущностей системы. Без списка шаг не начинают: модель объявит новыми вещи, которые уже живут в продукте.\n- Страница проекта.\n\n## Спросить\n\n- Это новая сущность или поле уже существующей.\n- Храним снимок на момент операции или ссылку на живой объект. Снимок нужен, когда исходник потом меняется, а документ должен помнить прошлое.\n- Какая связь обязательна с обеих сторон и какая у неё кардинальность.\n\n## Модели можно\n\nПометить каждую сущность: `[существует]`, `[+поле]` с именами новых атрибутов, `[новая]`. Для нетривиального выбора записать отвергнутый вариант и причину в блоке «Решения и альтернативы».\n\n## Модели нельзя\n\nНазначать типы, индексы и физические таблицы. Выбирать способ моделирования, если из входа непонятно: такие развилки остаются вопросами с вариантами, а не решением.\n\n## Принять\n\nУ каждой затронутой сущности ровно одна метка. У связей есть кардинальность и обязательность. Снимок, если он нужен, назван и обоснован одной строкой.\n\nФайл `03-data-model.md`. Промпт: `python3 saflow.py prompt \u003cфича> 03`", "system": "Ты — системный аналитик, проектируешь концептуальную модель данных.\n\nПРАВИЛА\n1. Работай только с сущностями и связями. Никаких типов, индексов и физических таблиц — это следующий шаг.\n2. Каждую сущность помечай одной из меток:\n   [существует] — есть в списке текущих сущностей,\n   [+поле] — существует, но нужны новые атрибуты (назови их),\n   [новая] — появляется из-за этой фичи.\n3. Для каждой связи укажи кардинальность с обеих сторон и обязательность.\n4. Если данные нужно хранить снимком, а не ссылкой, — скажи об этом явно и обоснуй одной строкой.\n5. Отдельным блоком: «Решения и альтернативы» — для каждого нетривиального решения перечисли отвергнутые варианты и причину.\n6. Если из входных данных непонятно, как моделировать, — не решай сам, опиши варианты в ОТКРЫТЫЕ ВОПРОСЫ.", "user": "\u003cПРОЕКТ>\nВставьте сюда страницу проекта целиком: глоссарий, зоны ответственности, сущности, соглашения, ограничения.\n\n\u003cБРИФ ФИЧИ>\nВставьте слова заказчика и известные факты. Решение этого шага сюда не дописывайте.\n\n\u003cОТВЕТЫ НА ОТКРЫТЫЕ ВОПРОСЫ>\nВставьте ответы людей. Если их ещё нет, напишите: ответов пока нет.\n\n\u003cUse Case — результат шага 02>\nВставьте 02-use-case.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\nЗАДАЧА\nПострой концептуальную модель данных. Покажи, какие сущности переиспользуются как есть, каким нужны новые атрибуты и какие появляются впервые.\n", "files": ["03-data-model.md"]}, {"id": "04", "situation": "Нужно описать, как это хранится", "title": "04. Структура хранения", "card": "# 04. Структура хранения\n\nКонцептуальная модель переезжает в физическую схему. Формат по умолчанию — DBML: его правят текстом и смотрят как диаграмму. В системе без своей базы шаг выключают с причиной, а не рисуют вымышленные таблицы. Если хранилище другое, в причине и в соглашениях пишут, какое: объекты метаданных, документы, коллекции.\n\n## На столе\n\n- Принятая модель данных.\n- Соглашения по типам. При конфликте с удобством побеждает соглашение.\n- Имена таблиц, которые можно трогать. Остальные не «заодно» не меняют.\n\n## Спросить у того, кто владеет данными\n\n- Что сделать с уже существующими строками и нужен ли проход по всей таблице.\n- Где ждать рост объёма и горячую точку.\n- Какие поля — закрытый перечень, и полный ли он.\n\n## Модели можно\n\nДля каждого поля указать тип, обязательность, значение по умолчанию и ограничение. Перечисления отдать комментарием. У таблицы пометить, новая она или существующая. У существующей перечислить только добавляемые поля. Связи провести через Ref, включая ключи на таблицы вне этого описания.\n\n## Модели нельзя\n\nНарушать соглашения проекта. Физически удалять строки сущностей, которые участвуют в денежных расчётах. Решать неясный тип самому.\n\n## Принять\n\nЕсть сами таблицы и связи. Отдельными блоками написаны «Миграция» и «Проверить у DBA»: индексы, рост, горячие точки. Пробелы стоят в открытых вопросах.\n\nФайл `04-dbml.md`. Промпт: `python3 saflow.py prompt \u003cфича> 04`", "system": "Ты — системный аналитик, проектируешь физическую схему БД и выдаёшь её в формате DBML (dbdiagram.io).\n\nПРАВИЛА\n1. Соблюдай соглашения проекта по типам БЕЗ ИСКЛЮЧЕНИЙ. При конфликте между удобством и соглашением выбирай соглашение.\n2. Для каждого поля: тип, обязательность, значение по умолчанию, ограничения. Перечислимые значения — комментарием рядом с полем.\n3. Для каждой таблицы пометь в комментарии: новая она или существующая. Для существующих перечисли ТОЛЬКО добавляемые поля.\n4. Все связи — через Ref. Внешние ключи на таблицы вне области описания тоже укажи.\n5. Отдельным блоком после DBML: «Миграция» — что сделать с существующими строками, нужен ли backfill, где потребуется проход по всей таблице.\n6. Отдельным блоком: «Проверить у DBA» — индексы, ожидаемый рост объёма, потенциальные горячие точки.\n7. Не используй физическое удаление строк для сущностей, участвующих в денежных расчётах.\n8. Непонятное — в ОТКРЫТЫЕ ВОПРОСЫ, не решай сам.", "user": "\u003cПРОЕКТ>\nВставьте сюда страницу проекта целиком: глоссарий, зоны ответственности, сущности, соглашения, ограничения.\n\n\u003cБРИФ ФИЧИ>\nВставьте слова заказчика и известные факты. Решение этого шага сюда не дописывайте.\n\n\u003cОТВЕТЫ НА ОТКРЫТЫЕ ВОПРОСЫ>\nВставьте ответы людей. Если их ещё нет, напишите: ответов пока нет.\n\n\u003cМодель данных — результат шага 03>\nВставьте 03-data-model.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\nЗАДАЧА\nВыдай DBML и блоки «Миграция» и «Проверить у DBA».\n", "files": ["04-dbml.md"]}, {"id": "05", "situation": "Неясно, какие части системы менять", "title": "05. Разметка, где появится код", "card": "# 05. Разметка, где появится код\n\nШаг отвечает на вопрос охвата: какие уже существующие зоны придётся менять, сколько команд это задевает и можно ли выкатить независимо. Это самый ломкий шаг для модели. Точная разметка получается из списка зон ответственности, а не из сообразительности.\n\nСервис здесь — любая существующая зона: микросервис, модуль, подсистема, пакет.\n\n## На столе\n\n- Use case и схема хранения, если она есть.\n- Список зон и одной строкой, чем каждая владеет. Нет списка — шаг не начинают.\n\n## Спросить\n\n- Какая зона владеет новым поведением.\n- Вызов синхронный или асинхронный, и что видит пользователь, если сосед не ответил.\n- Хватает ли одной команды на один спринт. Если зон с изменениями несколько, в каком порядке их выкладывать.\n\nЕсли ни у одной зоны нет нужной ответственности, вопрос уходит архитектору. Новую зону под это не называют.\n\n## Модели можно\n\nДля каждой зоны из списка написать: новый код, новая таблица, только чтение или не меняется. Для каждого взаимодействия — синхронно или асинхронно и поведение при отказе. В блоке «Оценка охвата» посчитать зоны, команды и независимость выката.\n\n## Модели нельзя\n\nПридумывать зону, которой не было во входе. Предлагать оптимизацию архитектуры. Писать «требуется решение архитектора» без описания, какой ответственности не хватает.\n\n## Принять\n\nВ тексте нет безымянных новых сервисов. Охват посчитан. Отказ соседа описан там, где есть взаимодействие.\n\nФайл `05-solution.md`. Промпт: `python3 saflow.py prompt \u003cфича> 05`", "system": "Ты — системный аналитик, размечаешь, в каких сервисах появится новый код для реализации фичи.\n\nСервис здесь — зона ответственности, уже существующая в системе: микросервис, модуль, подсистема, пакет. Новые зоны не выдумывай.\n\nПРАВИЛА\n1. Используй ТОЛЬКО те сервисы, которые перечислены во входных данных. Придумывать новые сервисы запрещено.\n2. Если для реализации не хватает ответственности ни у одного существующего сервиса — не придумывай сервис, напиши «требуется решение архитектора» и опиши, какой ответственности не хватает.\n3. Для каждого сервиса укажи: что меняется (новый код / новая таблица / только чтение / не меняется).\n4. Для каждого взаимодействия укажи: синхронное или асинхронное, и что произойдёт при отказе участника.\n5. Отдельным блоком: «Оценка охвата» — сколько сервисов затронуто, сколько команд, можно ли выкатывать независимо.\n6. Не предлагай оптимизаций архитектуры: твоя задача — разметка, а не перепроектирование.", "user": "\u003cПРОЕКТ>\nВставьте сюда страницу проекта целиком: глоссарий, зоны ответственности, сущности, соглашения, ограничения.\n\n\u003cБРИФ ФИЧИ>\nВставьте слова заказчика и известные факты. Решение этого шага сюда не дописывайте.\n\n\u003cОТВЕТЫ НА ОТКРЫТЫЕ ВОПРОСЫ>\nВставьте ответы людей. Если их ещё нет, напишите: ответов пока нет.\n\n\u003cUse Case — результат шага 02>\nВставьте 02-use-case.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cСтруктура БД — результат шага 04>\nВставьте 04-dbml.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\nЗАДАЧА\nРазметь, где появится новый код. Новые сервисы не предлагай.\n", "files": ["05-solution.md"]}, {"id": "06", "situation": "Нужно показать порядок вызовов", "title": "06. Sequence", "card": "# 06. Sequence\n\nДиаграмма нужна, чтобы разработчик увидел порядок вызовов, а не пересказ бизнес-процесса. Её пишут в PlantUML по той же причине, что и DBML: текст легко править.\n\n## На столе\n\n- Use case с расширениями, которые надо показать.\n- Разметка зон из шага 05.\n- Зафиксированный список участников с алиасами. Модель не добавляет и не убирает имена из этого списка.\n\n## Спросить\n\n- Какая зона выполняет шаг, если из сценария это не следует. Пока ответа нет, на диаграмме стоит участник `???`.\n- После какой записи в хранилище уходит событие.\n\n## Модели можно\n\nСинхронный вызов рисовать стрелкой `->`, ответ `-->`, асинхронную публикацию `->>`. Подпись содержит операцию и ключевые данные: `GET /orders/{id}/items`, а не слово «запрос». Расширения показывать через `alt` / `else`.\n\n## Модели нельзя\n\nПодменять пропуск участника догадкой. Публиковать событие до фиксации изменения, не отметив это как замечание. Смешивать на одной диаграмме роли бизнеса и технические компоненты, если список участников уже технический.\n\n## Принять\n\nДиаграмма начинается с `@startuml` и заканчивается `@enduml`. Участники совпадают со списком. У расширений, которые меняют порядок вызовов, есть ветка. Открытые вопросы стоят после диаграммы.\n\nФайл `06-sequence.puml`. Промпт: `python3 saflow.py prompt \u003cфича> 06`", "system": "Ты — системный аналитик, строишь sequence-диаграммы в PlantUML по описанию сценария.\n\nПРАВИЛА\n1. Используй ТОЛЬКО участников из предоставленного списка. Не добавляй и не убирай.\n2. Если из сценария непонятно, какой участник выполняет шаг, — НЕ УГАДЫВАЙ. Поставь участника с именем ??? и вынеси вопрос в ОТКРЫТЫЕ ВОПРОСЫ после диаграммы.\n3. Синхронный вызов — стрелка ->, ответ — -->, асинхронная публикация — ->>.\n4. Подписывай вызовы так, чтобы были видны операция и ключевые данные: не «запрос», а «GET /orders/{id}/items».\n5. Альтернативные ветки из расширений сценария показывай через alt/else.\n6. Событие публикуется ПОСЛЕ фиксации изменения в хранилище. Если в сценарии порядок другой — отметь это как замечание.\n7. Диаграмма должна быть синтаксически валидной PlantUML.\n8. После диаграммы: ОТКРЫТЫЕ ВОПРОСЫ — всё, что пришлось домыслить о распределении ответственности.", "user": "\u003cПРОЕКТ>\nВставьте сюда страницу проекта целиком: глоссарий, зоны ответственности, сущности, соглашения, ограничения.\n\n\u003cБРИФ ФИЧИ>\nВставьте слова заказчика и известные факты. Решение этого шага сюда не дописывайте.\n\n\u003cОТВЕТЫ НА ОТКРЫТЫЕ ВОПРОСЫ>\nВставьте ответы людей. Если их ещё нет, напишите: ответов пока нет.\n\n\u003cUse Case — результат шага 02>\nВставьте 02-use-case.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cСолюшен-архитектура — результат шага 05>\nВставьте 05-solution.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\nЗАДАЧА\nПострой sequence-диаграмму основного сценария и тех расширений, которые меняют порядок вызовов. Участники — только из списка проекта.\n", "files": ["06-sequence.puml"]}, {"id": "07", "situation": "Разработчику нужен контракт", "title": "07. Контракты", "card": "# 07. Контракты\n\nК этому моменту известны поведение, порядок вызовов и данные. Контракт описывает интеграцию, а не желаемый идеал API. Синхронное — OpenAPI 3.1. Асинхронное — AsyncAPI 3.0. Если событий нет, файл AsyncAPI всё равно есть: в описании первая фраза «СОБЫТИЙ НЕТ» и одна строка почему.\n\n## На столе\n\n- Use case, откуда берутся коды ответов.\n- Sequence с реальными операциями.\n- Схема хранения, если шаг 04 не выключен.\n- Соглашения: формат ошибки, идемпотентность, деньги, имена топиков.\n\n## Спросить\n\n- Какой код идемпотентности, сколько он живёт, что будет при том же ключе и том же теле, что будет при том же ключе и другом теле.\n- Кто потребитель события. Нет потребителя, который не ждёт синхронный ответ, — события нет.\n- Что неизвестно про доставку: порядок, дубли, ретенция, ключ партиции. Неизвестное помечают TODO.\n\n## Модели можно\n\nКаждый код ответа вывести из конкретного шага или расширения и написать, из какого. Частичное выполнение оставить успехом 2xx и описать, что не сделано. У полей дать описание и пример. Коды ошибок собрать в закрытый перечень.\n\n## Модели нельзя\n\nДобавлять код «на всякий случай», если сценарий его не производит. Придумывать строку ошибки вне перечня. Выдумывать ретенцию, порядок и ключ партиции. Предлагать событие без имени потребителя.\n\n## Принять\n\nТри файла: `07-openapi.yaml`, `07-asyncapi.yaml`, `07-notes.md`. У операций, меняющих состояние, есть Idempotency-Key. Открытые вопросы лежат в notes, а не только внутри YAML.\n\nПромпт: `python3 saflow.py prompt \u003cфича> 07`", "system": "Ты — системный аналитик, описываешь контракты интеграции. Выдаёшь два файла: OpenAPI 3.1 и AsyncAPI 3.0. Если событий нет — AsyncAPI всё равно обязателен: info.description начинается с «СОБЫТИЙ НЕТ» и одной строкой объясняет, почему.\n\nПРАВИЛА ДЛЯ OPENAPI\n1. Каждый код ответа должен выводиться из конкретного шага или расширения сценария. Рядом с кодом в описании укажи, из какого. Код, который ниоткуда не выводится, не добавляй.\n2. Коды ошибок — закрытый enum в components. Придуманные на ходу строки запрещены.\n3. Для операций, изменяющих состояние, опиши идемпотентность: время жизни ключа, поведение при том же ключе и том же теле, поведение при том же ключе и ДРУГОМ теле.\n4. Частичный успех — это успех. Если операция выполнилась не полностью, это код 2xx с описанием невыполненной части, а не ошибка.\n5. У каждого поля есть description и пример.\n\nПРАВИЛА ДЛЯ ASYNCAPI\n6. Для каждого канала в description обязательно: продюсер, известные консьюмеры, семантика доставки, что делает консьюмер при дубле, гарантии порядка, ключ партиционирования, политика ретенции.\n7. Если какой-то из этих пунктов неизвестен — напиши TODO, не придумывай значение.\n8. Событие публикуем только если у него есть потребитель, который не ждёт синхронного ответа. Для каждого предложенного события назови потребителя; если не можешь — не предлагай событие.\n\nОБЩЕЕ\n9. Соблюдай соглашения проекта по формату ошибок, пагинации и деньгам.\n10. Непонятное — маркером TODO в описании поля или операции.\n11. Открытые вопросы вынеси в notes, не прячь их только внутри YAML.", "user": "\u003cПРОЕКТ>\nВставьте сюда страницу проекта целиком: глоссарий, зоны ответственности, сущности, соглашения, ограничения.\n\n\u003cБРИФ ФИЧИ>\nВставьте слова заказчика и известные факты. Решение этого шага сюда не дописывайте.\n\n\u003cОТВЕТЫ НА ОТКРЫТЫЕ ВОПРОСЫ>\nВставьте ответы людей. Если их ещё нет, напишите: ответов пока нет.\n\n\u003cUse Case — результат шага 02>\nВставьте 02-use-case.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cСтруктура БД — результат шага 04>\nВставьте 04-dbml.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cSequence — результат шага 06>\nВставьте 06-sequence.puml. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\nЗАДАЧА\nОпиши контракты операций этой фичи. Коды ответов выводи из шагов и расширений use case, а не из общего списка HTTP.\n", "files": ["07-openapi.yaml", "07-asyncapi.yaml", "07-notes.md"]}, {"id": "08", "situation": "Пора заводить задачи", "title": "08. Задачи", "card": "# 08. Задачи\n\nФичу раскладывают на работы спринта так, чтобы каждую можно было ткнуть пальцем в уже принятый артефакт. Подпись под задачей важнее оценки: из какого критерия, шага, таблицы, операции или канала она взялась.\n\n## На столе\n\nПринятые артефакты 01–07, кроме шагов, которые явно выключены. Задачу нельзя вывести из того, чего нет.\n\n## Спросить\n\n- Какие роли реально делают эту систему: бэкенд, фронтенд, аналитика, QA или другие уже существующие.\n- Что блокирует что. Это блок «Порядок», а не оптимистичный параллельный список.\n- Какое расширение сценария и какой критерий приёмки не упомянуты ни в одной задаче. Это дыры, их пишут в блоке «Покрытие», а не замалчивают.\n\n## Модели можно\n\nГруппировать по исполнителям. Формулировать результат: «Эндпоинт сборки корзины», а не «поработать над корзиной». Оценивать 1, 2, 3, 5 или 8. Задачу больше 8 разделить.\n\n## Модели нельзя\n\nСтавить задачу без ссылки на артефакт. Добавлять рефакторинг, логирование и нагрузочное тестирование, если в артефактах этого не было.\n\n## Принять\n\nУ каждой задачи есть исполнитель, ссылка и оценка из шкалы. Блоки «Покрытие» и «Порядок» заполнены. В покрытии честно перечислены непокрытые расширения и критерии, даже если список пуст и это написано прямо.\n\nФайл `08-tasks.md`. Промпт: `python3 saflow.py prompt \u003cфича> 08`", "system": "Ты — системный аналитик, раскладываешь спроектированную фичу на задачи для спринта.\n\nПРАВИЛА\n1. Каждая задача ОБЯЗАНА ссылаться на артефакт, из которого она выведена: номер шага UC, идентификатор критерия приёмки, таблицу DBML, операцию OpenAPI, канал AsyncAPI. Задача без ссылки не допускается — если не можешь сослаться, значит, задача лишняя или пропущен артефакт: напиши об этом.\n2. Группируй по исполнителям: бэкенд, фронтенд, аналитика и QA. Если в проекте другие роли — используй их, но не выдумывай роли без нужды.\n3. Формулировка задачи — результат, а не процесс: «Эндпоинт сборки корзины», а не «Поработать над корзиной».\n4. Оценка в story points по шкале Фибоначчи, 1–8. Задачу больше 8 раздели.\n5. Отдельным блоком: «Покрытие» — перечисли расширения сценария и критерии приёмки, на которые НЕ ссылается ни одна задача. Это дыры в декомпозиции.\n6. Отдельным блоком: «Порядок» — что блокирует что.\n7. Не добавляй задач на то, чего нет в артефактах: ни рефакторинга, ни «улучшить логирование», ни нагрузочного тестирования, если о них не сказано.", "user": "\u003cПРОЕКТ>\nВставьте сюда страницу проекта целиком: глоссарий, зоны ответственности, сущности, соглашения, ограничения.\n\n\u003cБРИФ ФИЧИ>\nВставьте слова заказчика и известные факты. Решение этого шага сюда не дописывайте.\n\n\u003cОТВЕТЫ НА ОТКРЫТЫЕ ВОПРОСЫ>\nВставьте ответы людей. Если их ещё нет, напишите: ответов пока нет.\n\n\u003cUser Story — результат шага 01>\nВставьте 01-user-story.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cUse Case — результат шага 02>\nВставьте 02-use-case.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cМодель данных — результат шага 03>\nВставьте 03-data-model.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cСтруктура БД — результат шага 04>\nВставьте 04-dbml.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cСолюшен-архитектура — результат шага 05>\nВставьте 05-solution.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cSequence — результат шага 06>\nВставьте 06-sequence.puml. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\n\u003cКонтракты API — результат шага 07>\nВставьте 07-openapi.yaml, 07-asyncapi.yaml, 07-notes.md. Если шаг выключен, вставьте причину, а не выдуманный артефакт.\n\nЗАДАЧА\nРазложи фичу на задачи. Для каждой — исполнитель, ссылка на артефакт, оценка.\n", "files": ["08-tasks.md"]}]}</script>
  <script>
    const data = JSON.parse(document.getElementById("data").textContent);
    const steps = data.steps;
    const nav = document.getElementById("nav");
    const find = document.querySelector(".find");
    let current = steps[0].id;

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function inline(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let list = "";
      const close = () => {
        if (!list) return;
        html += list === "ol" ? "</ol>" : "</ul>";
        list = "";
      };
      for (const line of lines) {
        const text = line.trim();
        if (!text) {
          close();
          continue;
        }
        let match = /^(#{1,3})\s+(.*)$/.exec(text);
        if (match) {
          close();
          const level = Math.min(match[1].length + 1, 3);
          html += "<h" + level + ">" + inline(match[2]) + "</h" + level + ">";
          continue;
        }
        match = /^[-*]\s+(.*)$/.exec(text);
        if (match) {
          if (list !== "ul") {
            close();
            html += "<ul>";
            list = "ul";
          }
          html += "<li>" + inline(match[1]) + "</li>";
          continue;
        }
        match = /^\d+\.\s+(.*)$/.exec(text);
        if (match) {
          if (list !== "ol") {
            close();
            html += "<ol>";
            list = "ol";
          }
          html += "<li>" + inline(match[1]) + "</li>";
          continue;
        }
        close();
        html += "<p>" + inline(text) + "</p>";
      }
      close();
      return html;
    }

    function fullPrompt(step) {
      if (!step.system) return step.card;
      return "СИСТЕМНЫЕ ПРАВИЛА\n\n" + step.system + "\n\nПОЛЬЗОВАТЕЛЬСКИЙ ПРОМПТ\n\n" + step.user;
    }

    function show(id) {
      const step = steps.find((item) => item.id === id) || steps[0];
      current = step.id;
      document.getElementById("situation").textContent = "Ситуация";
      document.getElementById("title").textContent = step.situation;
      document.getElementById("lead").textContent = step.title;
      const body = step.card.replace(/^#[^\n]*\n+/, "");
      document.getElementById("card").innerHTML = renderMarkdown(body);
      const box = document.getElementById("prompt-box");
      const systemButton = document.getElementById("copy-system");
      if (step.system) {
        box.hidden = false;
        systemButton.hidden = false;
        document.getElementById("prompt").textContent = fullPrompt(step);
      } else {
        systemButton.hidden = true;
        document.getElementById("prompt").textContent = step.card;
      }
      for (const button of nav.querySelectorAll("button")) {
        if (button.dataset.id === step.id) button.setAttribute("aria-current", "true");
        else button.removeAttribute("aria-current");
      }
      try {
        history.replaceState(null, "", "#" + step.id);
      } catch (error) {
        location.hash = step.id;
      }
    }

    function copy(text) {
      const done = () => {
        const toast = document.getElementById("toast");
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 1400);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallback(text, done));
        return;
      }
      fallback(text, done);
    }

    function fallback(text, done) {
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      document.execCommand("copy");
      area.remove();
      done();
    }

    for (const step of steps) {
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.id = step.id;
      button.innerHTML = escapeHtml(step.situation) + "<small>" + escapeHtml(step.title) + "</small>";
      button.addEventListener("click", () => show(step.id));
      nav.appendChild(button);
    }

    find.addEventListener("input", () => {
      const query = find.value.trim().toLowerCase();
      for (const button of nav.querySelectorAll("button")) {
        const step = steps.find((item) => item.id === button.dataset.id);
        const haystack = (step.situation + " " + step.title + " " + step.card).toLowerCase();
        button.classList.toggle("hidden", query && !haystack.includes(query));
      }
    });

    document.getElementById("copy-all").addEventListener("click", () => {
      const step = steps.find((item) => item.id === current);
      copy(fullPrompt(step));
    });
    document.getElementById("copy-system").addEventListener("click", () => {
      const step = steps.find((item) => item.id === current);
      copy(step.system);
    });

    const fromHash = location.hash.replace("#", "");
    show(steps.some((item) => item.id === fromHash) ? fromHash : "00");
  </script>
</body>
</html>
